  synopsis: "Robert, a powerful civil rights lawyer, lives a seemingly stable life with his wife Amanda and their daughter Mica. After his close friend Domeng is murdered, Robert adopts Domeng’s son Matthew and raises him as part of the family. Years later, both Mica and Matthew follow Robert into the legal profession, growing up side by side as siblings in everything but blood. <p> As adults, emotional boundaries begin to blur. Mica confesses romantic feelings for Matthew, and despite his hesitation, the two become involved. At the same time, Matthew reveals a long-hidden truth to Robert: he has always known about Robert’s secret past relationship with Domeng and harbors feelings for him as well. This confession reignites suppressed desires and pulls Robert into a forbidden affair with Matthew, creating a web of secrecy that threatens the entire household. <p> When Mica becomes pregnant, tensions explode. The family struggles to contain the scandal and protect their public image, while jealousy, guilt, and betrayal tear them apart. Forced to choose between truth and reputation, each character confronts the cost of their decisions. The story ends with the family shattered by loss, and Matthew and Mica attempting to move forward while carrying the emotional weight of everything that came before.", 
  details: "My Father, Myself is a Filipino psychological melodrama that centers on taboo desire, family power dynamics, and emotional repression. Directed by Joel Lamangan, the film explores how secrecy and forbidden relationships destabilize a wealthy household that appears respectable from the outside. It blends courtroom drama elements with domestic tragedy, focusing less on action and more on psychological tension.<p> The film examines themes of identity, masculinity, patriarchy, and inherited trauma. Robert represents authority and social success, yet he is trapped by expectations tied to wealth and status. Matthew functions as both son and mirror to Robert’s hidden past, while Mica becomes the emotional center caught between love, loyalty, and betrayal. Much of the film’s tension comes from silence — what the characters refuse to admit publicly versus what they know privately.",

  details: "Itim (1976), released internationally as The Rites of May, is a Filipino gothic supernatural horror film directed by Mike de Leon in his feature debut. Written by Clodualdo del Mundo Jr. and Gil Quito, the film blends Catholic ritual, folk spirituality, and psychological horror within the quiet town of San Ildefonso during Holy Week. Starring Tommy Abuel, Mario Montenegro, and Charo Santos in her screen debut, the film is widely regarded as a landmark of 1970s Philippine cinema. It was later restored and showcased in major international retrospectives, including Cannes Classics, where it was praised as one of the most striking debut films in cinema histor",

  details: "Batch ’81 (1982), also known as Alpha Kappa Omega Batch ’81, is a Filipino psychological drama directed by Mike de Leon and co-written with Clodualdo del Mundo Jr. and Raquel Villavicencio. The film examines fraternity culture, authoritarian power, and group violence through the lens of ritualized initiation. Starring Mark Gil in his breakout role, it premiered at Cannes’ Directors’ Fortnight and is widely considered one of the defining Philippine films of the 1980s. Critics have praised it as an allegory of social conformity and institutional abuse, and it was later digitally restored for international screenings.",

  director: {
    name: "Lino Brocka",
    link: ""
  },
  details: "Cain and Abel (Cain at Abel, 1982) is a Philippine action–thriller drama directed by Lino Brocka, with story and screenplay by Ricardo “Ricky” Lee. Loosely inspired by the Biblical tale of fraternal conflict, the film stars Christopher de Leon as Ellis and Phillip Salvador as Lorenzo, rival brothers and sons of the domineering landowner Senyora Pina (Mona Lisa). The cast also includes Carmi Martin as Zita, Ellis’s fiancée from Manila; Cecille Castillo as Rina, the household helper and Ellis’s mistress; and Baby Delgado as Becky, Lorenzo’s wife. Produced and distributed by Cine Suerte, the film premiered internationally in Spain on September 18, 1982, becoming the first Philippine entry to the San Sebastián International Film Festival, before its Philippine theatrical release on October 8, 1982. In 2016, it was digitally restored and remastered by the ABS-CBN Film Restoration Project and Central Digital Lab, with the restored version premiering on August 11, 2016—cementing its status as a significant work in Brocka’s filmography.", 
  synopsis: "Lorenzo, the eldest son of Senyora Pina, returns home drunk from a countryside gathering and argues with his mother over modernizing the plantation through mechanization, which she firmly rejects. Their discussion escalates into a heated confrontation, exposing long-simmering resentment. The next day, Ellis, the favored younger son, comes home from Manila with his classmate Zita, who is invited to stay with the family. Lorenzo’s jealousy deepens as he witnesses his mother’s clear preference for Ellis. <p> Tensions rise further when Ellis discovers that his room has been used without his consent, sparking another argument that Senyora Pina quickly suppresses. Later that night, Lorenzo vents his bitterness at a nightclub, speaking angrily about his brother and their mother. As plans for Senyora Pina’s will surface, it becomes clear that Ellis is poised to inherit the family land, justified by accusations of Lorenzo’s mismanagement of the estate. Ellis then announces his decision to leave college and marry Zita—requests that Senyora Pina readily approves, despite her reservations—setting the stage for a violent and tragic escalation of sibling rivalry driven by inheritance, favoritism, and wounded pride.",

{
    title: "Working Girls",
  year: 1984,
  poster: "./image3/working.jpg",
  genre: [ "Feminism","Social Drama"],
  director: {
    name: "Ishmael Bernal",
    link: "https://en.wikipedia.org/wiki/Ishmael_Bernal"
  },
  details: "Working Girls (1984) is a Philippine drama directed by Ishmael Bernal, featuring an ensemble cast led by Hilda Koronel, Rio Locsin, Chanda Romero, Carmi Martin, Maria Isabel Lopez, Baby Delgado, and Gina Pareño. The film weaves together seven interrelated stories centered on women working in a large commercial bank in Makati, then the heart of the country’s corporate world. The screenplay, written by Jose F. Lacaba (often credited as Lacuesta), captures the language, social codes, and power dynamics of pre-digital office culture. <p>Historically, the film is significant for its sharp social observation and feminist lens at a time when women’s professional lives were rarely depicted with such nuance. Its backdrop—a looming bank crisis—mirrored real events in 1984, a turbulent year for Philippine finance marked by banking collapses and economic instability following the assassination of Benigno Aquino Jr. While not banned, the film was notable for its frank portrayal of ambition, sexuality, and moral compromise in the workplace. Working Girls is now regarded as one of Bernal’s key ensemble films and later inspired a 2010 remake directed by Jose Javier Reyes, reflecting how much corporate culture had changed.", 
  synopsis: "Set in Makati before the rise of Bonifacio Global City and modern trading floors, the film follows the everyday lives of seven women employed in different positions within a major bank. Carla Asuncion, a high-ranking executive, embodies the ideal of professional success, while the other women navigate varied struggles as secretaries, clerks, and staff members. Their ambitions for financial security and upward mobility shape their choices, often at the cost of personal relationships and moral certainty. One of the most poignant stories involves a debt-burdened secretary forced to secretly work as a call girl to survive. As office gossip, boardroom politics, and personal crises intersect, the film paints a layered portrait of women striving for agency within a demanding and unstable corporate world.",

  },
  details: "Karnal (international title: Of the Flesh, 1983) is a Philippine drama–horror film directed by Marilou Diaz-Abaya and written by Ricky Lee, adapted from the legal story “To Take a Life” by Teresa Añover Rodriguez. Starring Phillip Salvador, Cecille Castillo, Vic Silayan, and Charito Solis, the film is set in the 1930s during the American colonial period. It was filmed in Nueva Ecija, Rizal, and Metro Manila, with music by Ryan Cayabyab and cinematography by Manolo Abaya. <p> Historically, Karnal is highly significant as the final film in Diaz-Abaya’s loose feminist trilogy, following Brutal (1980) and Moral (1982). Together, these films used personal violence and social decay as metaphors for oppression during the Martial Law era. Karnal was selected as the Philippine entry to the 57th Academy Awards for Best Foreign Language Film, though it was not nominated. It was screened internationally, including at the London Film Festival (1984) and the Fukuoka International Film Festival (2001). In 2015, the film was digitally restored by ABS-CBN Film Restoration and premiered at the 11th Cinemalaya Independent Film Festival, reaffirming its place as a landmark of Philippine cinema.", 
  synopsis: "A middle-aged woman narrates the violent history of Mulawin, a town described as being only a step away from Hell, ruled by cruelty and fear. Newlyweds Narcing and Puring arrive from Manila to settle in Narcing’s hometown, where his tyrannical father Gusting becomes disturbed by Puring’s resemblance to his deceased wife. Gusting’s obsession and abuse ignite a chain of violence that fractures the family and terrorizes the community. <p> As tensions escalate, Narcing kills his father and is imprisoned, while Puring gives birth to a child the villagers deem monstrous. Tragedy compounds as Narcing escapes only to be recaptured and later takes his own life in jail, leaving Puring devastated. The narrator is eventually revealed as their niece, who recounts how cycles of violence destroyed their family. The film ends in ambiguity, with conflicting rumors about Puring’s fate—whether she became a prostitute or a nun—underscoring the film’s central theme: how truth, memory, and morality are distorted by fear, patriarchy, and power.",

  details: "Burlesk Queen (1977), directed by Celso Ad. Castillo, is widely regarded as a turning point in Vilma Santos’s career, marking her transition from a former teen idol into a serious, mature actress. Taking on the daring role of Chato, a young woman working in the burlesque scene to support her family, Santos broke away from her wholesome screen image and demonstrated remarkable range and emotional depth. <p> The film was both a commercial and critical success, becoming one of the top-grossing entries of the 1977 Metro Manila Film Festival. It won Best Picture and earned Vilma Santos the Best Actress award, firmly establishing her reputation as a dramatic performer and paving the way for her eventual title as the “Star for All Seasons.” The film is now considered a milestone in Philippine cinema for redefining female stardom and challenging conservative norms about women’s roles on screen.",

  },
  details: "Produced during the late Marcos era, White Slavery is part of the wave of Filipino sexploitation films, yet it bears Brocka’s signature attention to character depth and social realism, portraying how fragile individuals can be manipulated into sexual slavery. While considered a “minor” work compared to Brocka’s masterpieces such as Manila in the Claws of Light, Insiang, or Jaguar, the film demonstrates his trademark empathy for marginalized characters and critical perspective on societal injustices, highlighting the grim fate of rural migrants in the urban landscape of Manila. The film was written by Ricky Lee and features performances by Sarsi Emmanuelle, Emily Loren, Jaclyn Jose, Tita de Villa, and Ricky Davao.", 
  synopsis: "White Slavery tells the harrowing story of three young provincial women—Joy (Sarsi Emmanuelle), Pinang (Emily Loren), and Linet (Jaclyn Jose)—who arrive in Manila seeking honest work, only to fall into a trap of exploitation. Lured under the pretense of employment at a restaurant, they quickly discover that their new workplace, run by the cunning Mrs. Antiporda (Tita de Villa), is actually a bar where sexual services are forced upon them. Their attempts to escape are thwarted by Allan (Ricky Davao), the local pimp and enforcer of Mrs. Antiporda’s cruel operations. The film follows their desperate struggle, culminating in a tragic ending that ultimately leads to the collapse of the “house of sin.”",

    link: "https://en.wikipedia.org/wiki/Lino_Brocka"
  },
  details: "Sa Kabila ng Lahat (lit. In Spite of Everything) is a 1991 Philippine political thriller drama film directed by Lino Brocka, based on a story and screenplay by Roy C. Iglesias. Starring Dina Bonnevie and Tonton Gutierrez, the film follows Maia, a news commentator who becomes entangled in political corruption, extramarital affairs, and the illegal drug trade. Produced and distributed by Viva Films, it was theatrically released on May 15, 1991. This was the last film Brocka completed before his death in a car accident.", 
  synopsis: "Maia hosts the investigative news magazine program Punto Blangko (Point Blank), which exposes political corruption. After winning Best Public Affairs Show at the Philippine Television Awards, she and her co-host, radio commentator Mike, encounter a hostage situation where a Chinese businessman is killed by the criminal Van Turko, under orders from syndicate member Daniel Fu. The incident is linked to Mayor Ventura Velasco's corrupt network, including his enforcer Boy Boga.<p> Maia discovers Ventura's extramarital affairs, including one with her, which he uses to boost his reelection campaign. Amid growing threats and attempts to manipulate media coverage, Maia and Mike uncover connections between the mayor, his associates, and the criminal underworld. Tragic events ensue, including the deaths of Lala, Van Turko, and ultimately Mike, who shields Maia during an ambush. With Van Turko's recorded confession, Maia exposes the network's crimes while surviving multiple assassination attempts. <p> In the aftermath, Mayor Velasco dies from complications following a heart operation, and his wife Cresencia and school superintendent Primitivo Mundial are charged with graft and corruption. At the next Philippine Television Awards, Maia accepts an award on Mike's behalf and announces that his documentary series will air, honoring his fearless commitment to truth and journalistic integrity.",

  details: "T-Bird at Ako (1982), directed by Danny Zialcita, is a Filipino neo-noir crime drama starring Nora Aunor and Vilma Santos. Featuring one of Philippine cinema’s earliest LGBT portrayals, the film explores a butch lesbian (“t-bird”) romance. The screenplay was written by openly gay activist Portia Ilagan. In 2015, it was digitally restored by ABS-CBN Film Archives.",

{
    title: "Melancholia",
  year: 2008,
  poster: "./image3/melan.jpg",
  genre: [ "Slow Cinema","Emancipated Cinema"],
  director: {
    name: "Lav Diaz",
    link: "https://en.wikipedia.org/wiki/Lav_Diaz"
  },
  details: "Melancholia (2008), directed by Lav Diaz, is an experimental psychological drama that examines grief, guilt, and the lingering wounds of political violence in the Philippines. The film follows three deeply traumatized individuals participating in an immersive role-playing therapy designed to force them to confront their past. Through its slow pacing and long takes, the film explores how personal sorrow becomes inseparable from national history, particularly the emotional aftermath of activism, disappearance, and loss. Diaz presents suffering not as a single event but as a condition that reshapes identity, memory, and reality itself. The film won the Horizons Prize at the Venice International Film Festival and is widely regarded as one of Diaz’s most philosophically dense works.", 
  synopsis: "Two women and a man undergo an extreme therapeutic experiment created by Julian, a therapist who believes that assuming new identities can purge emotional trauma. The women live in disguise — one as a prostitute and the other as a nun — while Julian takes on the role of a pimp, refusing to break character even when the therapy begins to psychologically destabilize them. As the role-play continues, their buried histories surface: lost relationships, political rebellion, and unresolved grief tied to a vanished revolutionary figure named Renato. <p> The emotional strain pushes the participants toward breakdown. One woman disappears and is later found dead, intensifying the guilt and doubt surrounding Julian’s method. The narrative expands to depict Renato’s final days with communist fighters in the wilderness, linking private mourning to the broader violence of the country’s political past. In the aftermath, the surviving characters confront the emptiness left by their experiment. Julian retreats into denial, while the remaining woman struggles to reclaim her identity, suggesting that trauma cannot simply be performed away — it must be endured and remembered.",

{
    title: "Century of Birthing",
  year: 2011,
  poster: "./image3/century.jpg",
  genre: [ "Drama","Art House"],
  director: {
    name: "Lav Diaz",
    link: "https://en.wikipedia.org/wiki/Lav_Diaz"
  },
  details: "Century of Birthing (2011) is an eight-hour experimental drama written, edited, photographed, produced, and directed by Lav Diaz, one of the most internationally recognized figures in slow cinema. The film reflects Diaz’s own period of artistic crisis after several years of struggling to complete a project, turning that experience into a meditation on creativity, religion, and personal collapse. Known for its extremely long runtime, black-and-white cinematography, and minimalist style, the film continues Diaz’s signature exploration of Philippine social and spiritual life. It premiered at international festivals and strengthened Diaz’s reputation as a filmmaker committed to durational storytelling and philosophical inquiry, often compared to literary epics for its scale and ambition.", 
  synopsis: "A filmmaker suffers a prolonged creative breakdown while trying to complete an ambitious work. As his frustration deepens, he becomes obsessed with the imagined story of a rural religious cult whose rigid beliefs echo his own psychological imprisonment. His growing despair damages his relationships and drives him to destroy the very person who inspires his art. Faced with the consequences of his actions, he attempts to seek redemption and meaning while still trapped between artistic ambition and emotional ruin.",

  details: "Aswang is a 2019 Filipino documentary directed by Alyx Ayn Arumpac that examines the early years of President Rodrigo Duterte’s war on drugs. The film is an international co-production involving companies from the Philippines, France, Norway, and Germany. Development began in 2016 as a self-funded project before receiving institutional support from the Film Development Council of the Philippines through its International Film Studies Assistance Program. This backing allowed the team to pitch the project at the International Documentary Film Festival Amsterdam, where it later secured additional European co-production funding from the IDFA Bertha Fund. The documentary gained strong international attention for its on-the-ground perspective and observational style, positioning it as one of the most widely discussed Filipino documentaries of its decade.",

<script>
// In the position() function inside attachPreview(), change the top calculation:
function position(e){
  if (!shown) return;
  const px = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  const py = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 0;
  const el = preview;
  const padding = 12;
  const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
  const vwBox = el.offsetWidth || Math.min(360, Math.round(vw * 0.4));
  const boxH = el.offsetHeight || Math.round(vwBox * 1.4);
  
  let left = px + 20;
  let top = py - boxH - 20;  // Default: above cursor
  
  // Adjust horizontal position if too far right
  if (left + vwBox + padding > vw) left = vw - vwBox - padding;
  if (left < padding) left = padding;
  
  // Only show below if not enough room above AND there IS room below
  if (top < padding && (py + boxH + 40 < vh)) {
    top = py + 20;  // Show below cursor only if room exists
  } else if (top < padding) {
    top = padding;  // Clamp to top of viewport
  }
  
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}
</script>

// ADD: convert various YouTube URLs to embed form
function toEmbedUrl(url){
  if (!url) return '';
  try{
    const u = new URL(url, location.href);
    // youtu.be/<id>
    if (u.hostname.includes('youtu.be')) {
      return `https://www.youtube.com/embed/${u.pathname.replace('/','')}`;
    }
    // youtube watch?v=<id>
    if (u.hostname.includes('youtube.com')) {
      const id = u.searchParams.get('v');
      if (id) return `https://www.youtube.com/embed/${id}`;
      // already embed or other paths
      if (u.pathname.includes('/embed/')) return u.href;
    }
    // ok.ru direct video link embed
    if (u.hostname.endsWith('ok.ru') && u.pathname.startsWith('/video/')) {
      const videoId = u.pathname.split('/').pop();
      if (videoId) return `https://ok.ru/videoembed/${videoId}`;
    }
    
      // Dailymotion video links (short and full) -> embed
    if (u.hostname.endsWith('dailymotion.com')) {
      // Already embed
      if (u.pathname.startsWith('/embed/video/')) return u.href;
      // Standard /video/<id>...
      const m = u.pathname.match(/^\/video\/([a-zA-Z0-9]+)(?:[_\/]|$)/);
      const videoId = m && m[1];
      if (videoId) return `https://www.dailymotion.com/embed/video/${videoId}`;
    }
    if (u.hostname.endsWith('dai.ly')) {
      const videoId = u.pathname.replace('/','').split('_')[0];
      if (videoId) return `https://www.dailymotion.com/embed/video/${videoId}`;
    }
    // Google Drive preview link
    if (u.hostname.includes('drive.google.com')) {
      // Accept both /file/d/<id>/preview and /open?id=<id>
      let match = u.pathname.match(/\/file\/d\/([^/]+)\/preview/);
      if (match && match[1]) {
        return `https://drive.google.com/file/d/${match[1]}/preview`;
      }
      if (u.pathname === '/open' && u.searchParams.get('id')) {
        return `https://drive.google.com/file/d/${u.searchParams.get('id')}/preview`;
      }
       // Bilibili (intl .tv)
    if (u.hostname.endsWith('bilibili.tv')) {
      // Already embed
      if (u.pathname.includes('/embed/')) return u.href;
      // Locale-aware: /{locale}/video/{id}
      const m = u.pathname.match(/^\/([a-z]{2})\/video\/(\d+)(?:[\/?#]|$)/i);
      if (m) return `https://${u.hostname}/${m[1]}/embed/${m[2]}`;
      // Default: /video/{id}
      const m2 = u.pathname.match(/^\/video\/(\d+)(?:[\/?#]|$)/i);
      if (m2) return `https://${u.hostname}/embed/${m2[1]}`;
    }

    // Bilibili (main .com with BV id)
    if (u.hostname.endsWith('bilibili.com')) {
      const bv = u.pathname.match(/^\/video\/(BV[0-9A-Za-z]+)(?:[\/?#]|$)/);
      if (bv) return `https://player.bilibili.com/player.html?bvid=${bv[1]}&page=1`;
      const aid = u.searchParams.get('aid');
      if (aid) return `https://player.bilibili.com/player.html?aid=${aid}&page=1`;
    }
     // Facebook (watch, page/videos, short fb.watch) -> plugin embed
    if (host.endsWith('facebook.com')) {
      if (u.pathname.startsWith('/plugins/video.php')) return u.href; // already embed
      let canonical = u.href;
      if (u.pathname.startsWith('/watch')) {
        const vid = u.searchParams.get('v');
        if (vid) canonical = `https://www.facebook.com/watch/?v=${vid}`;
      } else {
        const m = u.pathname.match(/\/videos\/(\d+)/);
        if (m) canonical = `https://www.facebook.com${u.pathname.replace(/\/$/, '')}`;
      }
      return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(canonical)}&show_text=false&width=720&height=405&t=0`;
    }
    if (host.endsWith('fb.watch')) {
      return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u.href)}&show_text=false&width=720&height=405&t=0`;
    }

    }
    // Internet Archive (archive.org) -> embed
    if (u.hostname.includes('archive.org')) {
      if (u.pathname.startsWith('/embed/')) return u.href;
      const mDetails = u.pathname.match(/^\/details\/([^\/?#]+)(?:[\/?#]|$)/);
      if (mDetails) return `https://archive.org/embed/${mDetails[1]}`;
      const mDownload = u.pathname.match(/^\/download\/([^\/?#]+)(?:[\/?#]|$)/);
      if (mDownload) return `https://archive.org/embed/${mDownload[1]}`;
      const mMeta = u.pathname.match(/^\/metadata\/([^\/?#]+)(?:[\/?#]|$)/);
      if (mMeta) return `https://archive.org/embed/${mMeta[1]}`;
    }
    return u.href;
  }catch(e){
    return url;
  }
}

// Choose a Rotten Tomatoes badge based on percentage score string like "92%"
function getRottenIcon(scoreStr){
  const base = './image3/';
  if (!scoreStr || !scoreStr.trim()) return base + 'noinfo.png';
  const m = scoreStr.match(/(\d+)(?:%|)/);
  if (!m) return base + 'noinfo.png';
  const n = parseInt(m[1], 10);
  if (Number.isNaN(n)) return base + 'noinfo.png';
  // Certified fresh if >=75 per your rule
  if (n >= 75) return base + 'certifiedfresh.svg';
  if (n >= 60) return base + 'positive.png';
  if (n < 60) return base + '60%negative.png';
  return base + 'noinfo.png';
}

// Choose a letterboxd icon for numeric scores like "3.8"
function getLetterboxIcon(scoreStr){
  const base = './image3/';
  const n = parseFloat(scoreStr);
  if (!Number.isFinite(n)) return base + 'noinfo.png';
  return n >= 3.5 ? base + 'morethan3.5.svg' : base + 'lessthan3.5.svg';
}

function getPopcornIcon(scoreStr){
  const base = './image3/';
  if (!scoreStr || !scoreStr.toString().trim()) return base + 'grey.svg';
  const n = parseFloat(scoreStr);
  if (!Number.isFinite(n)) return base + 'grey.svg';
  if (n >= 3.5) return base + 'morethan3.5.svg';
  return base + 'lessthan3.5.svg';
}

// If popcornmeter (audience/popcorn score) is 4.0 or higher, show verified popcorn icon
function isVerifiedPopcorn(scoreStr){
  const n = parseFloat(scoreStr);
  return Number.isFinite(n) && n >= 4.0;
}

// Utility: produce a safe absolute URL or fallback
function safeLink(link, fallback) {
  if (!link || !link.trim()) return fallback;
  try {
    const u = new URL(link, location.href);
    if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
    return fallback;
  } catch (e) {
    return fallback;
  }
}

// Populate dynamic filter dropdowns
function populateFilters() {
  const years = new Set();
  const genres = new Set();
  const directors = new Set();

  FILMS.forEach(f => {
    if (f.year != null) years.add(f.year);
    (Array.isArray(f.genre) ? f.genre : []).forEach(g => {
      if (g && g.trim()) genres.add(g.trim());
    });
    const directorName = (f.director && typeof f.director === 'object') ? f.director.name : (f.director || '');
    if (directorName && directorName.trim()) directors.add(directorName.trim());
  });

  // Sort years ascending (numeric)
  const yearsSorted = Array.from(years).sort((a, b) => Number(a) - Number(b));
  yearsSorted.forEach(y => yearFilter.innerHTML += `<option value="${y}">${y}</option>`);

  // Sort genres A–Z (case-insensitive)
  const genresSorted = Array.from(genres).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  genresSorted.forEach(g => genreFilter.innerHTML += `<option value="${g}">${g}</option>`);

  // Sort directors A–Z (case-insensitive)
  const directorsSorted = Array.from(directors).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  directorsSorted.forEach(d => directorFilter.innerHTML += `<option value="${d}">${d}</option>`);
}

// Render
function renderFilms() {
  // honor saved view each render
  grid.classList.toggle('poster-view', VIEW_MODE === 'poster');
  grid.innerHTML = "";

  const q = searchBar.value.toLowerCase();
  const yf = yearFilter.value;
  const gf = genreFilter.value;
  const df = directorFilter.value;

  ACTIVE_FILMS.filter(f => {
    const _directorName = (f.director && typeof f.director === 'object') ? f.director.name : (f.director || '');
    if (q && !f.title.toLowerCase().includes(q)) return false;
    if (yf && f.year != yf) return false;
    if (gf && !f.genre.includes(gf)) return false;
    if (df && _directorName !== df) return false;
    return true;
  }).forEach((f) => {
    // REMOVE async Firebase fetch here; counts come from Firestore onSnapshot.
    if (typeof f.likes !== 'number') f.likes = 0;
    if (typeof f.dislikes !== 'number') f.dislikes = 0;

    const card = document.createElement("div");
    const filmId = getFilmId(f.title, f.year);
    card.dataset.filmId = filmId;

    // IMDB-based stars (score is like "4.7/10") with half-star support
    const imdbRaw = (f.ratings && f.ratings.imdb && f.ratings.imdb.score) || '';
    const imdbNum = parseFloat(imdbRaw) || NaN;
    const valueOutOf5 = Number.isFinite(imdbNum) ? imdbNum / 2 : NaN;
    const roundedToHalf = Number.isFinite(valueOutOf5) ? Math.round(valueOutOf5 * 2) / 2 : 0;
    const fullStars = Number.isFinite(roundedToHalf) ? Math.floor(roundedToHalf) : 0;
    const hasHalf = Number.isFinite(roundedToHalf) ? (roundedToHalf - fullStars === 0.5) : false;

    let stars = '';
    for (let i = 0; i < 5; i++) {
      if (i < fullStars) stars += `<span class="star full">★</span>`;
      else if (i === fullStars && hasHalf) stars += `<span class="star half">★</span>`;
      else stars += `<span class="star empty">★</span>`;
    }

    const scoreLabel = Number.isFinite(imdbNum) ? `<span class="rating-score">${imdbNum}/10</span>` : '';

    const directorName = (f.director && typeof f.director === 'object') ? f.director.name : (f.director || '');
    let directorLink = (f.director && typeof f.director === 'object') ? f.director.link : (f.director_link || '');
    const defaultSearch = directorName ? `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(directorName)}` : '#';
    directorLink = safeLink(directorLink, defaultSearch);

    if (VIEW_MODE === 'poster') {
      card.className = 'film-card poster-card';
      card.innerHTML = `
        <div class="film-poster">
          <img src="${f.poster}" alt="${f.title}">
        </div>
        <div class="poster-title">${f.title} (${f.year})</div>
        <div class="rating">${stars}${scoreLabel}</div>
        <div class="poster-synopsis"><p>${f.synopsis}</p></div>
        <div class="card-actions">
          <button class="like-btn" data-action="like">👍 <span class="count">${f.likes||0}</span></button>
          <button class="dislike-btn" data-action="dislike">👎 <span class="count">${f.dislikes||0}</span></button>
        </div>
      `;
    } else {
      card.className = 'film-card';
      card.innerHTML = `
        <div class="film-poster">
          <img src="${f.poster}" alt="${f.title}">
          <div class="rating">${stars}${scoreLabel}</div>
          <!-- removed poster-footer image to avoid 404 -->
        </div>
        <div class="film-info">
          <div class="film-title">${f.title} (${f.year})</div>
          <div class="film-director">Directed by: ${directorName ? `<a class="director-link" href="${directorLink}" target="_blank" rel="noopener noreferrer" aria-label="Profile for ${directorName.replace(/\"/g, '&quot;')}">${directorName}</a>` : 'Unknown'}</div>
          <div class="film-details">
            <div class="section-label">Details:</div>
            <p>${f.details}</p>
          </div>
          <div class="card-actions">
            <button class="like-btn" data-action="like"> <img src="./image3/up.svg" alt="like" class="like-icon"> <span class="count">${f.likes||0}</span></button>
            <button class="dislike-btn" data-action="dislike"><img src="./image3/down.svg" alt="dislike" class="like-icon"> <span class="count">${f.dislikes||0}</span></button>
          </div>
        </div>
      `;
    }

    // Stop propagation on any anchor inside the card
    card.querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => e.stopPropagation()));

    // Restore user's previous vote state ONLY (do not mutate counts)
    const voteKey = `vote_${(f.title||'').replace(/[^a-z0-9]/gi,'_')}_${f.year||''}`;
    const saved = localStorage.getItem(voteKey);
    if (saved === 'like') {
      const btn = card.querySelector('.like-btn'); if (btn) btn.classList.add('active');
    } else if (saved === 'dislike') {
      const btn = card.querySelector('.dislike-btn'); if (btn) btn.classList.add('active');
    }

    // Like/dislike click handlers
    const likeBtn = card.querySelector('.like-btn');
    const dislikeBtn = card.querySelector('.dislike-btn');
    function updateCounts(){
      if (likeBtn) likeBtn.querySelector('.count').textContent = f.likes;
      if (dislikeBtn) dislikeBtn.querySelector('.count').textContent = f.dislikes;
    }
    if (likeBtn) {
      likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const current = localStorage.getItem(voteKey);
        if (current === 'like') {
          localStorage.removeItem(voteKey);
          likeBtn.classList.remove('active');
          f.likes = Math.max(0, f.likes - 1);
        } else {
          localStorage.setItem(voteKey, 'like');
          likeBtn.classList.add('active');
          f.likes = (f.likes || 0) + 1;
          if (window.firebaseDB) window.firebaseDB.updateLikes(f.title, f.year, 'like');
          if (current === 'dislike') { 
            f.dislikes = Math.max(0, f.dislikes - 1); 
            const d = card.querySelector('.dislike-btn'); 
            if (d) d.classList.remove('active'); 
            if (window.firebaseDB) window.firebaseDB.updateLikes(f.title, f.year, 'dislike-remove');
          }
        }
        updateCounts();
      });
    }
    if (dislikeBtn) {
      dislikeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const current = localStorage.getItem(voteKey);
        if (current === 'dislike') {
          localStorage.removeItem(voteKey);
          dislikeBtn.classList.remove('active');
          f.dislikes = Math.max(0, f.dislikes - 1);
        } else {
          localStorage.setItem(voteKey, 'dislike');
          dislikeBtn.classList.add('active');
          f.dislikes = (f.dislikes || 0) + 1;
          if (window.firebaseDB) window.firebaseDB.updateLikes(f.title, f.year, 'dislike');
          if (current === 'like') { 
            f.likes = Math.max(0, f.likes - 1); 
            const l = card.querySelector('.like-btn'); 
            if (l) l.classList.remove('active');
            if (window.firebaseDB) window.firebaseDB.updateLikes(f.title, f.year, 'like-remove');
          }
        }
        updateCounts();
      });
    }

    card.onclick = () => openModal(f);
    
    // Attach poster hover preview (desktop + touch fallback)
    (function attachPreview(){
      const preview = document.getElementById('');
      if (!preview) return;
      const img = card.querySelector('.film-poster img');
      if (!img) return;
      let shown = false;
      function show(e){
        if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
        const pImg = preview.querySelector('img');
        const pTitle = preview.querySelector('.preview-title');
        pImg.src = img.src;
        if (pTitle) pTitle.textContent = `${f.title} (${f.year})`;
        preview.classList.add('show');
        shown = true;
        position(e);
      }
      function position(e){
        if (!shown) return;
        const px = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
        const py = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 0;
        const el = preview;
        const padding = 12;
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        const vwBox = el.offsetWidth || Math.min(360, Math.round(vw * 0.4));
        const boxH = el.offsetHeight || Math.round(vwBox * 1.4);
        
        let left = px + 20;
        let top = py - boxH - 20;  // Default: above cursor
        
        // Adjust horizontal position if too far right
        if (left + vwBox + padding > vw) left = vw - vwBox - padding;
        if (left < padding) left = padding;
        
        // Only show below if not enough room above AND there IS room below
        if (top < padding && (py + boxH + 40 < vh)) {
          top = py + 20;  // Show below cursor only if room exists
        } else if (top < padding) {
          top = padding;  // Clamp to top of viewport
        }
        
        el.style.left = left + 'px';
        el.style.top = top + 'px';
      }
      function hide(){ preview.classList.remove('show'); shown = false; preview.querySelector('img').src = ''; }
      img.addEventListener('mouseenter', show);
      img.addEventListener('mousemove', position);
      img.addEventListener('mouseleave', hide);
      // touch fallback: tap to show briefly, and open modal
      let touchTimer = null;
      img.addEventListener('touchstart', (e)=>{
        e.preventDefault();
        // Show preview
        show(e.touches ? e.touches[0] : e);
        clearTimeout(touchTimer);
        touchTimer = setTimeout(hide, 900);
        // Open modal on tap
        card.click();
      }, {passive:false});
    })();

    // Details and synopsis are truncated via CSS (line-clamp); do not remove them entirely
    grid.appendChild(card);
  });
}

    document.documentElement.classList.add('dark');
  }
  
  darkBtn.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    // Save preference
    if (document.documentElement.classList.contains('dark')) {
      localStorage.setItem('darkMode', 'enabled');
    } else {
      localStorage.removeItem('darkMode');
    }
  });
}

// Shuffle button
const shuffleBtn = document.getElementById('shuffleBtn');
if (shuffleBtn) {
  shuffleBtn.addEventListener('click', () => {
    // Fisher-Yates shuffle in-place on ACTIVE_FILMS
    for (let i = ACTIVE_FILMS.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ACTIVE_FILMS[i], ACTIVE_FILMS[j]] = [ACTIVE_FILMS[j], ACTIVE_FILMS[i]];
    }
    renderFilms();
  });
}

// Clear filters button
const clearBtn = document.getElementById('clearFiltersBtn');
if (clearBtn) {
  clearBtn.addEventListener('click', () => {
    searchBar.value = '';
    yearFilter.value = '';
    genreFilter.value = '';
    directorFilter.value = '';
    ACTIVE_FILMS = ORIGINAL_FILMS.slice();
    renderFilms();
  });
}

// View toggle (detailed <-> posters)
let VIEW_MODE = localStorage.getItem('viewMode') || 'poster';  // Load saved preference

const toggleViewBtn = document.getElementById('toggleViewBtn');

function updateViewToggleUI(){
  if (!toggleViewBtn) return;
  const ICONS = { poster: '☷', detailed: '☰' };
  const target = VIEW_MODE === 'detailed' ? 'poster' : 'detailed';
  toggleViewBtn.textContent = ICONS[target];
  toggleViewBtn.setAttribute(
    'aria-label',
    target === 'poster' ? 'Switch to Poster view' : 'Switch to Detail view'
  );
}

if (toggleViewBtn) {
  toggleViewBtn.addEventListener('click', () => {
    VIEW_MODE = VIEW_MODE === 'detailed' ? 'poster' : 'detailed';
    // Save preference
    localStorage.setItem('viewMode', VIEW_MODE);
    document.getElementById('filmGrid').classList.toggle('poster-view', VIEW_MODE === 'poster');
    renderFilms();
    updateViewToggleUI();
  });

// Initialize with saved view mode
document.getElementById('filmGrid').classList.toggle('poster-view', VIEW_MODE === 'poster');

// Initialize
populateFilters();
grid.classList.toggle('poster-view', VIEW_MODE === 'poster');
renderFilms();
updateViewToggleUI();

// ADD: live subscriptions when Firebase is ready
(function subscribeAllWhenReady(){
  const tryAttach = () => {
    if (!window.firebaseDB || !window.firebaseDB.subscribeCounts) return;
    if (!window._countUnsubs) window._countUnsubs = {};
    FILMS.forEach(f => {
      const filmId = getFilmId(f.title, f.year);
      if (window._countUnsubs[filmId]) return; // already subscribed
      const unsub = window.firebaseDB.subscribeCounts(f.title, f.year, (likes, dislikes) => {
        f.likes = likes|0; f.dislikes = dislikes|0;
        updateAllCountDisplays(filmId, f.likes, f.dislikes);
      });
      window._countUnsubs[filmId] = unsub;
    });
  };
  // try now and again shortly (module script loads later)
  tryAttach();
 
  const t = setInterval(() => {
    tryAttach();
    if (window.firebaseDB && window.firebaseDB.subscribeCounts) clearInterval(t);
  }, 300);
})();

genreFilter.addEventListener("change", renderFilms);

/* ADD: film id + dom updater */
function getFilmId(title, year){
  return `${(title||'').toString().toLowerCase().replace(/[^a-z0-9]+/g,'_')}_${year||''}`;
}

function updateAllCountDisplays(filmId, likes, dislikes){
  // update cards
  document.querySelectorAll(`.film-card[data-film-id="${filmId}"] .like-btn .count`)
    .forEach(el => el.textContent = likes);
  document.querySelectorAll(`.film-card[data-film-id="${filmId}"] .dislike-btn .count`)
    .forEach(el => el.textContent = dislikes);
  // update modal if this film is open
  if (modal && modal.classList.contains('open') && modal.dataset.filmId === filmId){
    const ml = document.querySelector('.modal-like-btn .count');
    const md = document.querySelector('.modal-dislike-btn .count');
    if (ml) ml.textContent = likes;
    if (md) md.textContent = dislikes;
  }
}

// expose to module script safely
window.getFilmId = getFilmId;
window.updateAllCountDisplays = updateAllCountDisplays;

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getFirestore, doc, setDoc, updateDoc, onSnapshot, increment, getDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBLk8ih6kw4uJkdrTXv4EZnqVjEhGweWgs",
    authDomain: "pknowyourfilms.firebaseapp.com",
    projectId: "pknowyourfilms",
    storageBucket: "pknowyourfilms.firebasestorage.app",
    messagingSenderId: "450842546266",
    appId: "1:450842546266:web:11b608d6bdd5c9b4c38863",
    measurementId: "G-BETBSFWJWR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.firebaseDB = {
    updateLikes: async (filmTitle, year, action) => {
      const filmId = `${(filmTitle||'').replace(/[^a-z0-9]/gi,'_')}_${year||''}`;
      const ref = doc(db, "films", filmId);
      try {
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          await setDoc(ref, { title: filmTitle, year, likes: 0, dislikes: 0 });
        }
        const updateObj = {};
        if (action === 'like') updateObj.likes = increment(1);
        else if (action === 'dislike') updateObj.dislikes = increment(1);
        else if (action === 'like-remove') updateObj.likes = increment(-1);
        else if (action === 'dislike-remove') updateObj.dislikes = increment(-1);
        await updateDoc(ref, updateObj);
      } catch (e) {
        console.error("Firebase update error:", e);
      }
    },

    subscribeCounts: (filmTitle, year, cb) => {
      const filmId = `${(filmTitle||'').replace(/[^a-z0-9]/gi,'_')}_${year||''}`;
      const ref = doc(db, "films", filmId);
      // ensure doc exists
      getDoc(ref).then(snap => {
        if (!snap.exists()) setDoc(ref, { title: filmTitle, year, likes: 0, dislikes: 0 });
      }).catch(()=>{});
      return onSnapshot(ref, snap => {
        const d = snap.data() || { likes: 0, dislikes: 0 };
        cb((d.likes||0), (d.dislikes||0));
      }, err => console.error("Firebase subscribe error:", err));
    }
  };
</script>
