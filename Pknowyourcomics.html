<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comic Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- USE YOUR CSS -->
<link rel="stylesheet" href="comics.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
<a href="home.html" class="index-logo-link" aria-label="Back to Index">
  <img src="image/logo2.svg" alt="Back to Index" class="main-logo">
</a>


<header>
  <img class="logo" src="image/comics.svg" alt="Comics">
</header>

<section id="comicGrid" class="grid"></section>

<!-- Modal -->
<div id="comicBackdrop" class="comic-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="comicTitle">
  <div class="comic-modal">

    <div class="comic-modal-header">
      <div class="comic-modal-title" id="comicTitle"></div>
      <button class="comic-modal-close" onclick="closeModal()" aria-label="Close modal">✕</button>
    </div>

    <div class="comic-modal-body">

      <!-- INFO -->
      <div class="tab-panel active" id="panel-info" role="tabpanel" aria-labelledby="tab-info">
        <div class="info-layout">
          <div class="info-poster">
            <figure class="comic-cover" id="comicCover"></figure>
            <div class="comic-meta" id="comicMeta"></div>
          </div>
          <div class="info-details">
            <div id="comicInfo"></div>
          </div>
        </div>
      </div>



      <!-- AUTHOR -->
      <div class="tab-panel" id="panel-author" role="tabpanel" aria-labelledby="tab-author" hidden>
        <div class="info-layout author-layout">
          <div class="info-poster author-poster">
            <div class="author-avatar">
              <img id="authorPhoto" alt="Author photo">
            </div>
            <div class="author-meta" id="comicAuthorMeta"></div>
          </div>
          <div class="info-details author-details">
            <div class="author-copy" id="comicAuthor"></div>
          </div>
        </div>
      </div>

      <!-- VIDEO -->
      <div class="tab-panel" id="panel-video" role="tabpanel" aria-labelledby="tab-video" hidden>
        <div>
          <iframe id="comicVideo" allowfullscreen></iframe>
        </div>
      </div>

      <!-- READER -->
      <div class="tab-panel" id="panel-read" role="tabpanel" aria-labelledby="tab-read" hidden>
        <iframe id="comicReadFrame"></iframe>
      </div>

    </div>

    <!-- Tabs -->
    <div class="comic-tabs" id="comicTabs" role="tablist">
      <button class="comic-tab active" id="tab-info" role="tab" aria-selected="true" aria-controls="panel-info" data-tab="info" onclick="showComicTab('info')">Info</button>
      <button class="comic-tab" id="tab-author" role="tab" aria-selected="false" aria-controls="panel-author" data-tab="author" onclick="showComicTab('author')">Author</button>
            <button class="comic-tab" id="tab-video" role="tab" aria-selected="false" aria-controls="panel-video" data-tab="video" onclick="showComicTab('video')">Video</button>

      <button class="comic-tab" id="tab-read" role="tab" aria-selected="false" aria-controls="panel-read" data-tab="read" onclick="showComicTab('read')">Read</button>
    </div>

  </div>
</div>

<script>
const comics = [
{

  title: "Darna",
  cover: "image5/darna.jpg",
  authorphoto: "image5/mars.webp",
  authorinfo: `Mars Ravelo was a Filipino comic book writer, illustrator, and storyteller best known for creating some of the Philippines' most beloved superheroes and fantasy characters. He was born on October 9, 1916, in Tanza and died on September 12, 1988.

Ravelo revolutionized Philippine comics by creating stories that blended action, fantasy, romance, and social themes. His most famous creation is Darna, a superheroine who transforms from the ordinary girl Narda into a powerful defender of justice. Darna has become one of the most enduring cultural icons in the Philippines.

Some of Ravelo's other well-known creations include:

Captain Barbell
Lastikman
Dyesebel
Captain Marvel (not related to the American superhero)

His works have been adapted into numerous comic books, films, television series, and stage productions, making him one of the most influential figures in Philippine entertainment. Because of his lasting impact, Mars Ravelo is often called the "King of Philippine Komiks."

His stories continue to inspire new generations of readers and audiences, and many of his characters remain central figures in Filipino popular culture.`,
 authormeta: `Writer: Mars Ravelo
Illustrator: Nestor Redondo`, 
meta: {
    firstAppearance: "1950",
    genre: "Superhero",
    publisher: "Pilipino Komiks"
  },

  info: `Darna is a fictional Filipino superheroine and one of the most iconic characters in Philippine popular culture. Created by Mars Ravelo and first introduced in 1950, Darna is the alter ego of a kind-hearted young woman named Narda.

By swallowing a magical white stone and shouting the name "Darna!", she transforms into a powerful warrior with extraordinary abilities. Darna possesses superhuman strength, speed, flight, enhanced durability, and exceptional combat skills.

She uses her powers to protect innocent people, fight evil, and defend justice against both human criminals and supernatural threats.

Despite her immense power, Darna is admired not only for her courage and determination but also for her compassion, humility, and willingness to sacrifice herself for others.

Over the decades, Darna has appeared in numerous comic books, films, television series, and stage productions, becoming a lasting symbol of heroism, hope, and female empowerment in the Philippines.`,



  video: "https://www.youtube.com/embed/5PjVjNTLOhQ",
  reader: "https://filipinokomiks.com/darna"
},
{
  title: "Kenkoy",
  cover: "image5/kenkoy.webp",
  authorphoto: "image5/kenkoy-author.jpg",
  meta: {
    firstAppearance: "1929",
    genre: "Humor",
    publisher: "Liwayway"
  },
  info: "One of the earliest Filipino comic icons.",
  author: "Tony Velasquez",
  video: "https://www.youtube.com/embed/xoLPVGgGCF0",
  reader: "https://example.com"
}
];

const grid = document.getElementById("comicGrid");
const backdrop = document.getElementById("comicBackdrop");

let focusableElements = [];
let firstFocusableElement;
let lastFocusableElement;

function render() {
  grid.innerHTML = comics.map((c,i)=>`
    <div class="card" onclick="openModal(${i})">
      <img src="${c.cover}">
      <div class="card-info">
        <h3>${c.title}</h3>
      </div>
    </div>
  `).join("");
}

function formatParagraphs(text) {
  return text
    .trim()
    .split(/\n{2,}/)
    .map(para => `<p>${para.replace(/\n/g, '<br>')}</p>`)
    .join('');
}

function openModal(i) {
  const c = comics[i];
  document.getElementById("comicTitle").textContent = c.title;
  document.getElementById("comicCover").innerHTML = `<img src="${c.cover}">`;
  document.getElementById("comicInfo").innerHTML = formatParagraphs(c.info);
  document.getElementById("comicAuthorMeta").innerHTML = c.authormeta ? c.authormeta.replace(/\n/g, '<br>') : '';
  document.getElementById("comicAuthor").innerHTML = c.authorinfo ? formatParagraphs(c.authorinfo) : (c.author ? c.author.replace(/\n/g, '<br>') : '');
  document.getElementById("authorPhoto").src = c.authorphoto || '';
  document.getElementById("authorPhoto").alt = `Author photo for ${c.title}`;
  document.getElementById("comicMeta").innerHTML = c.meta ?
    `<strong>First Appearance:</strong> ${c.meta.firstAppearance}<br>` +
    `<strong>Genre:</strong> ${c.meta.genre}<br>` +
    `<strong>Publisher:</strong> ${c.meta.publisher}` : '';
  document.getElementById("comicVideo").src = c.video;
  document.getElementById("comicReadFrame").src = c.reader;
  showComicTab('info');
  backdrop.classList.add("open");

  // Set up focus trap
  setTimeout(() => {
    focusableElements = backdrop.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    firstFocusableElement = focusableElements[0];
    lastFocusableElement = focusableElements[focusableElements.length - 1];
    firstFocusableElement?.focus();
  }, 50);
}

function closeModal() {
  backdrop.classList.remove("open");
  document.getElementById("comicVideo").src = "";
  document.getElementById("comicReadFrame").src = "";
  showComicTab('info');
}

function showComicTab(tab) {
  // Buttons
  document.querySelectorAll('#comicTabs .comic-tab').forEach(btn => {
    const isActive = btn.dataset.tab === tab;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', String(isActive));
  });
  // Panels
  document.querySelectorAll('.tab-panel').forEach(panel => {
    const isActive = panel.id === `panel-${tab}`;
    panel.classList.toggle('active', isActive);
    panel.hidden = !isActive;
  });
}

// Event delegation for tabs
document.getElementById('comicTabs')?.addEventListener('click', (e) => {
  const btn = e.target.closest('.comic-tab');
  if (btn) showComicTab(btn.dataset.tab);
});

// Focus trap
backdrop.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    return;
  }

  if (e.key === 'Tab') {
    if (e.shiftKey) {
      if (document.activeElement === firstFocusableElement) {
        e.preventDefault();
        lastFocusableElement?.focus();
      }
    } else {
      if (document.activeElement === lastFocusableElement) {
        e.preventDefault();
        firstFocusableElement?.focus();
      }
    }
  }
});

// Keyboard navigation for tabs
document.getElementById('comicTabs')?.addEventListener('keydown', (e) => {
  const tabs = Array.from(document.querySelectorAll('.comic-tab'));
  const currentIndex = tabs.indexOf(document.activeElement);

  if (e.key === 'ArrowRight') {
    e.preventDefault();
    const nextIndex = (currentIndex + 1) % tabs.length;
    tabs[nextIndex].focus();
    showComicTab(tabs[nextIndex].dataset.tab);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    const prevIndex = (currentIndex - 1 + tabs.length) % tabs.length;
    tabs[prevIndex].focus();
    showComicTab(tabs[prevIndex].dataset.tab);
  }

});
backdrop.addEventListener('click', (event) => {
  if (event.target === backdrop) {
    closeModal();
  }
});

render();
</script>

<style>
/* Tabs + panes */
/* =========================
   COMIC TABS
========================= */

.comic-tabs {
    display: flex;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 24px 20px;
    background: transparent;
    border: none;
}

.comic-tab {
    font-family: "Bangers", cursive;
    font-size: 0.95rem;
    color: #555;
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    width: 200px;
}

.comic-tab:hover,
.comic-tab.active {
    background: #111;
    color: #fff;
    border-color: #111;
}

.tab-panel {
    display: none;
    height: 100%;
    min-height: 0;
}

.tab-panel.active {
    display: block;
    height: 100%;
}

.comic-modal-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(0, 0, 0, 0.55);
    padding: 24px;
    z-index: 1000;
}

.comic-modal-backdrop.open {
    display: grid;
}           

.comic-modal {
    width: 95%;
    max-width: 1200px;
    height: 850px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 5px solid #111;
    border-radius: 25px;
    background: #F7F3EC;
    box-shadow:
        12px 12px 0 #111,
        0 25px 60px rgba(0,0,0,.35);
}

.comic-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 25px;
    background:
        radial-gradient(circle,#efc04a 12%,transparent 12%),
        #d8943f;
    background-size: 18px 18px;
    border-bottom: 5px solid #111;
}

.comic-modal-title {
    font-family: "Bangers", cursive;
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: white;
    text-shadow:
        3px 3px #111,
        -2px -2px #111;
}

.comic-modal-close {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 4px solid #111;
    background: #ff5757;
    color: white;
    font-size: 24px;
    cursor: pointer;
    transition: .2s;
}

.comic-modal-close:hover {
    transform: rotate(15deg) scale(1.1);
    background: #ff3030;
}

.comic-modal-body {
    flex: 1;
    padding: 30px;
    overflow: hidden;
    background: #F7F3EC;
    display: grid;
    gap: 20px;
    min-height: 0;
}

.info-layout {
    display: grid;
    grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
    gap: 35px;
    align-items: start;
    height: 100%;
    min-height: 0;
}

.info-poster {
    background: white;
    border: 5px solid #111;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 8px 8px 0 #111;
}

.comic-cover img {
    width: 100%;
    border: 3px solid #111;
    border-radius: 10px;
    display: block;
}

.comic-meta {
    margin-top: 18px;
    padding: 15px;
    background: #fff;
    border: 3px solid #111;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.7;
}

.info-details,
.author-details {
    position: relative;
    padding: 2px 24px 6px 30px;
    border: 5px solid #111;
    border-radius: 30px;
    background: #FFF6C9;
    box-shadow: 8px 8px 0 #111;
    line-height: 1.5;
    font-size: 20px;
    font-family: "Comic Neue", sans-serif;
    font-weight: 450;
    color: #000000;
    overflow-y: auto;
    overflow-x: hidden;
    max-height: 100%;
    min-height: 0;
    height: 100%;
    scrollbar-width: none; /* Firefox */
    scroll-behavior: smooth;
    scrollbar-color: #d8933f54 transparent; /* Firefox */
}

/* Hide scrollbar by default */
.info-details::-webkit-scrollbar,
.author-details::-webkit-scrollbar {
    width: 0;
    transition: width 0.2s ease;
}

/* Show scrollbar on hover */
.info-details:hover,
.author-details:hover {
    scrollbar-width: thin; /* Firefox */
}

.info-details:hover::-webkit-scrollbar,
.author-details:hover::-webkit-scrollbar {
    width: 8px;
}

.info-details::-webkit-scrollbar-track,
.author-details::-webkit-scrollbar-track {
    background: transparent;
}

.info-details::-webkit-scrollbar-thumb,
.author-details::-webkit-scrollbar-thumb {
    background: #d8943f;
    border-radius: 9999px;
}

.info-details::-webkit-scrollbar-button,
.author-details::-webkit-scrollbar-button {
    display: none;
}

.info-details::-webkit-scrollbar-corner,
.author-details::-webkit-scrollbar-corner {
    background: transparent;
}

.info-details::after,
.author-details::after {
    position: absolute;
    left: -22px;
    bottom: 40px;
    width: 36px;
    height: 36px;
    background: #FFF6C9;
    border-left: 5px solid #111;
    border-bottom: 5px solid #111;
    transform: rotate(45deg);
}

.author-layout {
    align-items: start;
}

.author-poster {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    gap: 18px;
}

.author-avatar img {
    width: 100%;
    border: 3px solid #111;
    border-radius: 10px;
    display: block;
}

.author-copy {
    font-size: 20px;
    line-height: 1.6;
    font-family: "Comic Neue", sans-serif;
    color: #000;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
}

.author-meta {
    margin-top: 0;
    padding: 14px 18px;
    background: #fff;
    border: 3px solid #111;
    border-radius: 12px;
    box-shadow: 4px 4px 0 #111;
    font-weight: 700;
    line-height: 1.6;
}

.author-copy {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 18px;
}

.author-copy p {
    margin: 0 0 1rem;
}

.comic-tabs {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 18px;
    background: #EFEAE2;
    border-top: 5px solid #111;
}

.comic-tab {
    padding: 12px 28px;
    border: 4px solid #111;
    border-radius: 12px;
    background: white;
    font-family: "Comic Neue", sans-serif;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    transition: .2s;
    box-shadow: 5px 5px 0 #111;
}

.comic-tab:hover {
    transform: translate(-2px,-2px);
    box-shadow: 7px 7px 0 #111;
}

.comic-tab.active {
    background: #FFCA3A;
    color: #111;
}

.comic-bubble {
    font-size: 18px;
    line-height: 1.9;
    white-space: pre-line;
}

#panel-video iframe {
    width: 100%;
    aspect-ratio: 16/9;
    border: 5px solid #111;
    border-radius: 18px;
    box-shadow: 8px 8px 0 #111;
}

#comicReadFrame {
    width: 100%;
    height: 70vh;
    border: 5px solid #111;
    border-radius: 18px;
    background: white;
}

body {
    font-family: "Comic Neue", sans-serif;
}

.comic-modal-title {
    font-family: "Bangers", cursive;
}

@media (max-width: 760px) {
    .info-layout {
        grid-template-columns: 1fr;
    }

    .comic-modal {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }
}

.comic-bubble {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 1rem;
    line-height: 1.75;
}

.comic-bubble p {
    margin: 0 0 1rem;
}

.tab-panel#panel-video.active {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 650px;
    width: 100%;
}

#panel-video iframe,
#comicReadFrame {
    width: 750px;
    min-height: 500px;
    border: 1px solid #ddd;
    border-radius: 18px;
    background: #fff;
    overflow: hidden;
}

.index-logo-link {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999;
    display: inline-block;
}

.main-logo {
    width: 110px;
    transition: transform .25s ease;
}

.main-logo:hover {
    transform: rotate(-8deg) scale(1.08);
}

@media (max-width: 760px) {
    .info-layout {
        grid-template-columns: 1fr;
    }

    .comic-modal {
        width: 100%;
    }

    .comic-modal-body,
    .comic-tabs {
        padding-left: 18px;

    }
}

</style>

</body>
</html>
