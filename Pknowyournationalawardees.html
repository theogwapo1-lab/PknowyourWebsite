<style>
:root{
  --bg: url('image7/museum.webp');
  --card:#faf7f1;
  --surface:#ffffff;
  --gold:#b08b42;
  --gold-light:#d4b36c;
  --text:#1d1d1d;
  --muted:#666666;
  --border:#d8ccb6;
  --shadow:0 8px 30px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --radius:18px;
  --accent:var(--gold);
}

body{
  margin:0;
  font-family:Georgia, "Garamond", serif;
  font-size: 16px;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  color:var(--text);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background: url('image7/museum.jpg');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}


 .wrap{max-width:1100px;margin:0 auto;padding:24px 18px}
.logo {
    display: block;
    width: 100%;
    max-width: 1000px;
    margin: 6px auto -90px; /* negative bottom margin */
}    .disclaimer{text-align:center;font-size:12px;color:var(--meta-color);margin-top:6px}


/* ===== GRID ===== */
#awardeeGrid{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

/* ===== CARD ===== */
.card{
    position: relative;
    width: 300px;
    height: 400px;
    overflow: hidden;

    border-radius: 18px;
    border: 1px solid var(--border);

    background: linear-gradient(180deg,#fff,#f8f5ef);

    box-shadow: var(--shadow);

    transition:
        transform .45s cubic-bezier(.22,.61,.36,1),
        box-shadow .45s cubic-bezier(.22,.61,.36,1);

    will-change: transform;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg, #6d5428, #d7bf83, #8b6a2c);
}
.card:hover{
    transform:translateY(-8px);
    box-shadow:0 22px 45px rgba(0,0,0,.18);
}

.card img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    display:block;

    transform:scale(1.01);
    transition:transform .7s cubic-bezier(.22,.61,.36,1),
               filter .7s cubic-bezier(.22,.61,.36,1);
}

.card:hover img{
    transform:scale(1.07);
}


/* ===== SLIDE INFO ===== */
.card-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:20px;
  background:linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.45), transparent);
  color:white;
}

.card-info h3{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:26px;
  font-weight:600;
  letter-spacing:.5px;
  margin:0;
  color:#fff;
}

.card-info .award{
  margin-top:6px;
  color:#d7bc72;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:11px;
}

.card-info p{
  font-size:13px;
  color:#f2e9dc;
  line-height:1.4;
}

.snippet{
  opacity:0;
  max-height:0;
  overflow:hidden;
  transition:.35s;
}

.card:hover .snippet{
  opacity:1;
  max-height:120px;
  margin-top:10px;
}

/* ===== MODAL ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  overflow: hidden;
  z-index: 1000;
  box-sizing: border-box;
}

.modal.open {
  opacity: 1;
  pointer-events: auto;
}

/* Main modal panel */
.modal-content {
  width: min(900px, 100%);
  height: 600px;
  max-height: calc(100vh - 32px);
  overflow: hidden;
  padding: 18px 22px;
  position: relative;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  font-family: Georgia, "Garamond", serif;
  background: linear-gradient(180deg, #46311dc5 0%, #342214 100%);
  color: #977e3b;
  border-radius: 18px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 220, 140, 0.15);
}

.modal-content::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(201, 160, 84, 0.45);
  border-radius: 12px;
  pointer-events: none;
}

/* Tabs container */
.modal-tabs,
.window-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-shrink: 0;
}

/* Tab buttons */
.modal-tabs button,
.window-tabs .tab {
  padding: 6px 14px;
  background: #4b3420;
  color: #f3e3b8;
  border: 1px solid #b58b45;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  transition: 0.2s;
  cursor: pointer;
}

.modal-tabs button:hover,
.window-tabs .tab:hover {
  background: #654526;
}

.modal-tabs button.active,
.window-tabs .tab.active {
  background: #b58b45;
  color: #23170c;
}

/* Modal body layout */
.tab-content {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  padding: 0;
}

.tab-panel {
  display: none;
  height: 100%;
}

.tab-panel.active {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.modal-body {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 18px;
  min-height: 0;
  overflow: hidden;
}

.tab-panel.active > * {
  min-height: 0;
}

.modal-left{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;

    width:fit-content;
    height:fit-content;
    align-self:start;
}
#modalImg{
    width:190px;
    height:250px;
    object-fit:cover;

    display:block;
    cursor:pointer;
    flex-shrink:0;

    padding:8px;                      /* Creates the frame */
    background:#f8f1de;               /* Light parchment */
    border:2px solid #c49b53;         /* Gold border */
    border-radius:10px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(255,255,255,.25);
}

/* Text content */
.modal-info {
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
  padding-right: 8px;
}

.modal-info h1 {
  margin: 0;
  font-size: 30px;
  color: #f6d58a;
}

.modal-info h2 {
  margin: 2px 0 12px;
  font-size: 28px;
  color: #ccb98b;

}

.modal-info p {
  margin: 5px 0;
  line-height: 1.5;
  color: #eee2c6;

}

/* Biography section */
.modal-bio {
  margin-top: 10px;
}

/* Works list */
#modalWorks {
  margin-top: 8px;
  padding-left: 18px;
}

#modalWorks li {
  margin-bottom: 4px;
}

/* References */
#modalReferences a {
  color: #dcb86a;
  text-decoration: underline;
}

#modalReferences a:hover {
  color: #fff1bf;
}

/* Close button */
.modal-close {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 28px;
  cursor: pointer;
  color: #d8b86c;
}

.modal-close:hover {
  color: white;
}

@media (max-width: 760px) {
  .modal-content {
    padding: 14px 16px;
  }

  .modal-body {
    grid-template-columns: 1fr;
    overflow-y: auto;
  }

  .modal-left {
    padding: 10px;
  }

  #modalImg {
    width: 160px;
    height: 220px;
  }
}

.controls {
  margin: 24px 0 0 0;
  padding: 18px 24px;
  border-radius: 16px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.controls-row {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.search-input {
  width: 100%;
  max-width: 1000px;
  padding: 10px 14px;
  border-radius: 999px;
  border:1px solid #d6cab3;
  background:#fff;
  color:#3a2f21;
  font-size: 15px;
  margin-bottom: 8px;
  outline: none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.04);
  transition: border-color .2s, box-shadow .2s;
}
.search-input:focus {
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(176,139,66,.15);
}

.dark-toggle {
  position: fixed;
  right: 20px;
  top: 20px;
  padding: 8px 14px;
  border-radius: 8px;
}

.pill {
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid #d6cab3;
  background: rgba(255,255,255,.78);
  color: #3a2f21;
  font-size: 15px;
  outline: none;
  transition: border 0.2s, background 0.2s, transform 0.2s;
  cursor: pointer;
}
.pill:focus, .pill:hover {
  border-color: var(--gold);
  background: #fff;
  transform: translateY(-1px);
}

.btn {
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid #cbb78f;
  font-size: 15px;
  cursor: pointer;
  font-weight:600;
  background:#fff;
  color:#000000;
  transition: background 0.25s, color 0.25s, transform 0.25s;
}

.btn:hover {
  background:linear-gradient(180deg, #fff, #f4ecd8);
  transform:translateY(-2px);
}

.btn-clear {
  color: #3a2f21;
}

.btn-shuffle {
  color: #3a2f21;
}

/* Responsive for controls */
@media (max-width: 600px) {
  .controls {
    padding: 10px 6px;
  }
  .controls-row {
    flex-direction: column;
    gap: 8px;
  }
  .search-input {
    max-width: 100%;
  }
}

.window-tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid #333;
  margin-bottom: 14px;
  height: 50px;
}

.window-tabs .tab {
  padding: 10px 16px;
  color: #ccc;
  border: none;
  border-radius: 10px 10px 0 0;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s, color 0.2s;
}

.window-tabs .tab:hover {
  background: #2a3446;
  color: #fff;
}

.window-tabs .tab.active {
  background: #111827;
  color: #fff;
  border-bottom: 2px solid #ffb73a;
}

/* ===== TAB CONTENT ===== */
.tab-content {
  background: transparent;
  padding: 18px;
  border-radius: 0 12px 12px 12px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tab-panel {
  display: none;
  animation: fade 0.25s ease;
  min-height: 0;
}

.tab-panel.active {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.subtitle{
    display:flex;
    align-items:center;
    gap:6px;

    margin:2px 0;
    font-size:14px;
    line-height:1.3;
}

.subtitle span:last-child{
    color:#f2e7cc;
}

/* Optional: Fade animation for tab panels */
@keyframes fade {
  from { opacity: 0; transform: translateY(4px);}
  to { opacity: 1; transform: translateY(0);}
}

h1,h2,h3 {
  letter-spacing:.6px;
  font-weight:500;
}

.award {
  letter-spacing:2px;
  text-transform:uppercase;
  font-size:11px;
  color:var(--gold);
}

::selection {

}

::-webkit-scrollbar {

}

::-webkit-scrollbar-track {

}

::-webkit-scrollbar-thumb {

// clear button functionality
document.getElementById("clearBtn").onclick = function() {
  document.getElementById("searchInput").value = "";
  document.getElementById("yearFilter").value = "all";
  document.getElementById("genreFilter").value = "all";
  document.getElementById("authorFilter").value = "all";
  renderGrid(AWARDEES);
};


// theme toggle (updated)
    const THEME_KEY = 'theme';
    const themeToggles = document.querySelectorAll('.dark-toggle');

    function updateThemeIcon(theme){
      themeToggles.forEach(btn => {
        btn.textContent = theme === 'theme-dark' ? 'Light Mode' : 'Dark Mode';
        btn.setAttribute('aria-label', theme === 'theme-dark' ? 'Switch to light mode' : 'Switch to dark mode');
      });
    }
    function applyTheme(theme){
      document.body.classList.remove('theme-light','theme-dark');
      document.body.classList.add(theme);
      updateThemeIcon(theme);
    }
    function initTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      const preferred = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'theme-dark' : 'theme-light');
      applyTheme(preferred);
    }
    themeToggles.forEach(btn => {
      btn.addEventListener('click', () => {
        const next = document.body.classList.contains('theme-dark') ? 'theme-light' : 'theme-dark';
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });
    });
    initTheme();

const grid = document.getElementById("awardeeGrid");

AWARDEES.forEach(a=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <img src="${a.image}">
    <div class="card-info">
      <h3>${a.name}</h3>
      <div class="award">${a.award}</div>
      <p class="snippet">${a.snippet}</p>
    </div>
  `;
  card.onclick=()=>openModal(a);
  grid.appendChild(card);
});
// shuffle function
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function renderGrid(list) {
  grid.innerHTML = "";
  list.forEach(a => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${a.image}">
      <div class="card-info">
        <h3>${a.name}</h3>
        <div class="award">${a.award}</div>
        <p class="snippet">${a.snippet}</p>
      </div>
    `;
    card.onclick = () => openModal(a);
    grid.appendChild(card);
  });
}



// filtering functionality

// 1. Populate filter dropdowns
function populateFilters() {
  const years = new Set();
  const categories = new Set();
  const presidents = new Set();

  AWARDEES.forEach(a => {
    if (a.year) years.add(a.year);
    if (a.award) categories.add(a.award);
    if (a.President) presidents.add(a.President);
  });

  // Year filter
  const yearFilter = document.getElementById("yearFilter");
  yearFilter.innerHTML = '<option value="all">Years</option>';
  Array.from(years).sort().forEach(y => {
    yearFilter.innerHTML += `<option value="${y}">${y}</option>`;
  });

  // Category filter
  const genreFilter = document.getElementById("genreFilter");
  genreFilter.innerHTML = '<option value="all">Category</option>';
  Array.from(categories).sort().forEach(c => {
    genreFilter.innerHTML += `<option value="${c}">${c}</option>`;
  });

  // President filter
  const authorFilter = document.getElementById("authorFilter");
  authorFilter.innerHTML = '<option value="all">President</option>';
  Array.from(presidents).sort().forEach(p => {
    authorFilter.innerHTML += `<option value="${p}">${p}</option>`;
  });
}

// 2. Filter logic
function getFilteredAwardees() {
  const year = document.getElementById("yearFilter").value;
  const category = document.getElementById("genreFilter").value;
  const president = document.getElementById("authorFilter").value;
  const search = document.getElementById("searchInput").value.toLowerCase();

  return AWARDEES.filter(a => {
    const matchYear = year === "all" || a.year === year;
    const matchCategory = category === "all" || a.award === category;
    const matchPresident = president === "all" || a.President === president;
    const matchSearch =
      !search ||
      a.name.toLowerCase().includes(search) ||
      (a.snippet && a.snippet.toLowerCase().includes(search));
    return matchYear && matchCategory && matchPresident && matchSearch;
  });
}

// 3. Listen for filter changes
["yearFilter", "genreFilter", "authorFilter", "searchInput"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => {
    renderGrid(getFilteredAwardees());
  });
  document.getElementById(id).addEventListener("input", () => {
    renderGrid(getFilteredAwardees());
  });
});

// 4. Update clear button to reset filters and grid
document.getElementById("clearBtn").onclick = function() {
  document.getElementById("searchInput").value = "";
  document.getElementById("yearFilter").value = "all";
  document.getElementById("genreFilter").value = "all";
  document.getElementById("authorFilter").value = "all";
  renderGrid(AWARDEES);
};

// 5. Call once on load
populateFilters();

// Initial render
renderGrid(AWARDEES);

document.getElementById("shuffleBtn").onclick = function() {
  shuffleArray(AWARDEES);
  renderGrid(AWARDEES);
};

function openModal(a){
  document.getElementById("modal").classList.add("open");
  // Info tab
  document.getElementById("modalImg").src = a.image || "";
  document.getElementById("modalName").textContent = a.name || "";
  document.getElementById("modalAward").textContent = a.award || "";
document.getElementById("modalYear").textContent = a.year || "";
document.getElementById("modalPresident").textContent = a.President || "";
  document.getElementById("modalBio").textContent = a.bio || "";

  // Video player
  const videoContainer = document.getElementById("modalVideoContainer");
  const videoFrame = document.getElementById("modalVideo");
  if (a.video && a.video.trim()) {
    videoContainer.style.display = "";
    videoFrame.src = a.video;
  } else {
    videoContainer.style.display = "none";
    videoFrame.src = "";
  }

  // Works tab
  const worksList = document.getElementById("modalWorks");
worksList.innerHTML = "";
if (a.works && Array.isArray(a.works) && a.works.length) {
  // Check if works are objects (with image/title/description)
  if (typeof a.works[0] === "object" && a.works[0] !== null) {
    a.works.forEach(work => {
      // Skip empty works
      if (!work.title && !work.image && !work.description) return;
      const div = document.createElement("div");
      div.style.display = "flex";
      div.style.alignItems = "flex-start";
      div.style.gap = "16px";
      div.style.marginBottom = "18px";
      div.innerHTML = `
${work.image ? `<img src="${work.image}" alt="${work.title || ''}">` : ""}        <div>
          <div style="font-weight:bold;font-size:16px;">${work.title || ""}</div>
          <div style="font-size:13px;color:#bbb;">${work.description || ""}</div>
        </div>
      `;
      worksList.appendChild(div);
    });
  } else {
    // Fallback for string-only works
    a.works.forEach(work => {
      const div = document.createElement("div");
      div.textContent = work;
      worksList.appendChild(div);
    });
  }
} else {
  worksList.innerHTML = "<div>No works available.</div>";
}

  // References tab
  const referencesDiv = document.getElementById("modalReferences");
  referencesDiv.innerHTML = "";
  if (a.references && Array.isArray(a.references) && a.references.length) {
    a.references.forEach(ref => {
      referencesDiv.innerHTML += `<div><a href="${ref.url}" target="_blank">${ref.title}</a></div>`;
    });
  } else {
    referencesDiv.innerHTML = "No references available.";
  }

  // Reset to Info tab on open
  document.querySelectorAll('.window-tabs .tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.window-tabs .tab[data-tab="info"]').classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
  document.getElementById('info').classList.add('active');
}

function openPhotoViewer(src) {
  const modal = document.getElementById('photoViewerModal');
  const img = document.getElementById('photoViewerImg');
  img.src = src;
  modal.style.display = 'flex';
}

document.getElementById('photoViewerModal').onclick = function(e) {
  if (e.target === this) this.style.display = 'none';
};



// Modal tab functionality
document.querySelectorAll('.window-tabs .tab').forEach(tab => {
  tab.addEventListener('click', function() {
    // Remove active class from all tabs
    document.querySelectorAll('.window-tabs .tab').forEach(t => t.classList.remove('active'));
    // Add active class to clicked tab
    this.classList.add('active');
    // Hide all tab panels
    document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
    // Show the selected tab panel
    const tabName = this.getAttribute('data-tab');
    document.getElementById(tabName).classList.add('active');
  });
});
// close modal when clicking outside content
document.getElementById("modal").addEventListener("mousedown", function(e) {
  if (e.target === this) {
    closeModal();
  }
});

document.getElementById('modalImg').onclick = function(e) {
  e.stopPropagation();
  if (this.src) openPhotoViewer(this.src);
};

// works images click to open viewer

document.getElementById('modalWorks').onclick = function(e) {
  if (e.target && e.target.tagName === 'IMG') {
    e.stopPropagation();
    if (e.target.src) openPhotoViewer(e.target.src);
  }
};

authorPhoto.onclick = (e) => {
  e.stopPropagation();
  openPhotoViewer(book['Author Photo']);
};

function closeModal(){
  document.getElementById("modal").classList.remove("open");
}
